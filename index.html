<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MATRIX HUB — DELTA TERMINAL</title>
    <style>
        :root {
            --bg-color: #050508; 
            --panel-bg: #0d0e15;
            --cyber-blue: #00f0ff; 
            --cyber-red: #ff0055; 
            --text-color: #ffffff;
            --matrix-green: #00ff66;
        }

        body {
            font-family: 'Courier New', Courier, monospace, 'Segoe UI';
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* الهيدر الجديد: شعار تقني مشفر ومستقبلي بديل لـ SHD */
        .cyber-header {
            width: 100%;
            max-width: 450px;
            text-align: center;
            margin-bottom: 30px;
            padding: 10px;
            border-bottom: 2px dashed rgba(255, 0, 85, 0.3);
        }

        .cyber-title {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 4px;
            color: var(--text-color);
            text-shadow: 2px 2px var(--cyber-red), -2px -2px var(--cyber-blue);
            margin: 0;
            text-transform: uppercase;
        }

        .cyber-subtitle {
            font-size: 0.8rem;
            color: var(--cyber-blue);
            letter-spacing: 2px;
            margin-top: 5px;
            font-weight: bold;
        }

        .main-content {
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        /* صندوق الصورة الهندسي الجديد */
        .terminal-box {
            background-color: var(--panel-bg);
            border-left: 4px solid var(--cyber-blue);
            border-right: 4px solid var(--cyber-red);
            border-top: 1px solid rgba(255,255,255,0.05);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            border-radius: 4px;
            padding: 12px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            position: relative;
        }

        .terminal-box::before {
            content: 'SYSTEM: ACTIVE';
            position: absolute;
            top: -10px;
            right: 15px;
            background: var(--cyber-blue);
            color: #000;
            font-size: 0.65rem;
            padding: 2px 6px;
            font-weight: bold;
            border-radius: 3px;
        }

        .banner-img {
            width: 100%;
            border-radius: 2px;
            display: block;
            filter: hue-rotate(180deg) brightness(0.9); /* يغير طابع الصورة المرفوعة لتناسب السايببربانك */
        }

        /* قسم المميزات الرقمي */
        .info-panel {
            background: rgba(13, 14, 21, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 4px;
            margin-bottom: 30px;
            text-align: right;
        }

        .panel-title {
            font-size: 1.2rem;
            color: var(--cyber-red);
            margin-bottom: 15px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .spec-line {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px dashed rgba(255,255,255,0.05);
            font-size: 0.95rem;
        }
        .spec-line:last-child { border-bottom: none; }

        .spec-tag { color: #888; }
        .spec-value { color: #fff; font-weight: bold; }

        .tag-glow-blue { color: var(--cyber-blue); text-shadow: 0 0 8px var(--cyber-blue); }

        /* شارات الحالة الهندسية */
        .grid-status {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 25px;
        }

        .badge-cyber {
            padding: 6px 16px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 3px;
            letter-spacing: 1px;
        }
        .badge-online { background: rgba(0, 255, 102, 0.1); border: 1px solid var(--matrix-green); color: var(--matrix-green); }
        .badge-offline { background: rgba(255, 0, 85, 0.1); border: 1px solid var(--cyber-red); color: var(--cyber-red); }

        /* أزرار التحميل بنمط الكومبيوتر المتطور والزوايا الحادة */
        .cyber-btn {
            background: transparent;
            color: var(--cyber-blue);
            border: 2px solid var(--cyber-blue);
            width: 100%;
            padding: 16px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            transition: all 0.2s ease;
            margin-bottom: 15px;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.1);
        }

        .cyber-btn:hover {
            background: var(--cyber-blue);
            color: #000;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
            transform: scale(1.01);
        }

        .cyber-btn-secondary {
            border-color: var(--cyber-red);
            color: var(--cyber-red);
            box-shadow: 0 0 10px rgba(ff, 0, 55, 0.1);
        }

        .cyber-btn-secondary:hover {
            background: var(--cyber-red);
            color: #fff;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
        }
    </style>
</head>
<body>

    <!-- الهيدر التقني الجديد بالكامل -->
    <div class="cyber-header">
        <h1 class="cyber-title">RTX SYSTEM</h1>
        <div class="cyber-subtitle">// TERMINAL ENGINE CONNECTED //</div>
    </div>

    <div class="main-content">
        <!-- صندوق العرض المطور -->
        <div class="terminal-box">
            <img class="banner-img" src="https://githubusercontent.com" alt="Delta Interface">
        </div>

        <!-- قائمة البيانات والمميزات بشكلها الهندسي المختلف -->
        <div class="info-panel">
            <div class="panel-title">> حزمة المزايا الأساسية</div>
            
            <div class="spec-line">
                <span class="spec-tag">مستوى الحماية الحالي:</span>
                <span class="spec-value tag-glow-blue">أقصى تشفير أمني</span>
            </div>
            
            <div class="spec-line">
                <span class="spec-tag">نظام تجاوز المفاتيح:</span>
                <span class="spec-value">توليد تلقائي وسريع</span>
            </div>
            
            <div class="spec-line">
                <span class="spec-tag">محرك البحث البرمجي:</span>
                <span class="spec-value tag-glow-blue">مدعوم بالكامل للسكربتات</span>
            </div>
        </div>

        <!-- شارات الحالة الهندسية -->
        <div class="grid-status">
            <span class="badge-cyber badge-online">CORE: ONLINE</span>
            <span class="badge-cyber badge-offline">SECURE: BYPASS</span>
        </div>

        <!-- أزرار التثبيت الذكية والمختلفة كلياً بالتأثيرات البصرية -->
        <button class="cyber-btn" onclick="openSecureNode()">
            [ Execute Download Node ]
        </button>

        <button class="cyber-btn cyber-btn-secondary" onclick="openSecureNode()">
            [ Alternative Server Link ]
        </button>
    </div>

    <script>
        function openSecureNode() {
            // فتح صفحة التحميل الآمنة والمستقرة لتفادي تعليق نظام أبل الداخلي للآيفون
            window.open("https://delta.bz", "_blank");
        }
    </script>
</body>
</html>
