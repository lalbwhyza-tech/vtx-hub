<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHD HUB — هاك دلتا للايفون</title>
    <style>
        :root {
            --bg-color: #000b18; /* خلفية زرقاء داكنة جداً */
            --card-bg: rgba(0, 20, 40, 0.6);
            --neon-blue: #00bfff; /* لون أزرق مشع */
            --neon-accent: #0077ff; /* لون أزرق متمم */
            --text-color: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .navbar {
            width: 100%;
            max-width: 450px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 0 10px;
        }

        /* إعادة شعار SHD المضيء باللون الأزرق النيون */
        .brand-logo {
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(to right, var(--neon-accent), var(--neon-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(0, 191, 255, 0.4);
        }

        .menu-icon {
            color: var(--neon-blue);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .content-container {
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .welcome-title {
            font-size: 1.4rem;
            line-height: 1.6;
            margin-bottom: 25px;
            font-weight: bold;
        }
        .welcome-title span {
            color: var(--neon-blue);
            font-weight: 900;
        }

        .image-card {
            background: var(--card-bg);
            border: 2px solid rgba(0, 191, 255, 0.2);
            border-radius: 24px;
            padding: 15px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 191, 255, 0.15);
        }

        .delta-banner {
            width: 100%;
            border-radius: 16px;
            display: block;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .features-section {
            margin-bottom: 30px;
        }

        .features-title {
            font-size: 1.6rem;
            color: var(--neon-blue);
            font-weight: bold;
            margin-bottom: 20px;
        }

        .feature-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            padding: 0 20px;
            font-size: 1.1rem;
        }

        .feature-text {
            color: #ffffff;
            font-weight: 500;
        }

        .feature-sparkle {
            color: var(--neon-blue);
            font-size: 1.2rem;
            text-shadow: 0 0 8px var(--neon-blue);
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 2px solid #00ff66;
            color: #00ff66;
            background: rgba(0, 255, 102, 0.05);
            padding: 8px 30px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 15px;
            box-shadow: inset 0 0 10px rgba(0, 255, 102, 0.1);
        }

        /* زر التثبيت الأزرق المطور */
        .install-btn {
            background: linear-gradient(135deg, #0055ff, #00bfff);
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 16px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 6px 20px rgba(0, 191, 255, 0.3);
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .install-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 191, 255, 0.5);
        }

        .install-btn svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .status-badge-failed {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 2px solid #ff3366;
            color: #ff3366;
            background: rgba(255, 51, 102, 0.05);
            padding: 8px 30px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 25px;
        }

        .admin-trigger {
            margin-top: 40px;
            opacity: 0.2;
            font-size: 0.8rem;
            cursor: pointer;
        }
        .admin-panel {
            background: var(--card-bg);
            border: 1px solid rgba(0, 191, 255, 0.2);
            padding: 15px;
            border-radius: 12px;
            margin-top: 15px;
            display: none;
            text-align: right;
        }
        input {
            width: 100%; padding: 10px; margin: 10px 0;
            background: #000510; border: 1px solid rgba(0,191,255,0.3);
            color: #fff; border-radius: 8px; box-sizing: border-box;
        }
    </style>
</head>
<body>

    <!-- الهيدر المحدث بشعار SHD -->
    <div class="navbar">
        <div class="brand-logo">SHD</div>
        <div class="menu-icon">☰</div>
    </div>

    <div class="content-container">
        <div class="welcome-title">
            مرحباً بك في موقع <span>SHD</span> هنا لدينا هاك<br>دلتا للايفون
        </div>

        <div class="image-card">
            <!-- كرت بانر دلتا نينجا التوضيحي -->
            <img class="delta-banner" src="https://imgbox.com" alt="Delta Executor Ninja">
        </div>

        <div class="features-section">
            <div class="features-title">مميزات هاك دلتا</div>
            
            <div class="feature-row">
                <span class="feature-text">من اقوى الهاكات حمايتاً</span>
                <span class="feature-sparkle">✦</span>
            </div>
            
            <div class="feature-row">
                <span class="feature-text">سهولة الحصول على المفتاح</span>
                <span class="feature-sparkle">✦</span>
            </div>
            
            <div class="feature-row">
                <span class="feature-text">يمكنك بحث السكربتات فيه</span>
                <span class="feature-sparkle">✦</span>
            </div>
        </div>

        <div>
            <div class="status-badge">يعمل ✓</div>
        </div>

        <!-- زر التثبيت الأزرق المطور مع بروتوكول فتح نافذة تنزيل نظام الـ iOS التلقائية -->
        <button class="install-btn" onclick="triggerDirectInstall()">
            Delta Install
            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
        </button>

        <div>
            <div class="status-badge-failed">لا يعمل ✕</div>
        </div>

        <div class="admin-trigger" onclick="toggleAdmin()">إعدادات رابط التثبيت المباشر</div>
        <div id="admin-panel" class="admin-panel">
            <p style="font-size: 0.85rem; color: var(--neon-blue);">ضع رابط ملف الـ plist الخاص بك بالأسفل وتلقائياً سيخرج أمر التثبيت التلقائي للعميل:</p>
            <input type="text" id="plist-url" placeholder="مثال: https://delta.bz">
            <button class="install-btn" style="padding:8px; font-size:1rem;" onclick="savePlistUrl()">حفظ وتحديث الرابط</button>
        </div>
    </div>

    <script>
        let storedPlistUrl = localStorage.getItem('rtx_plist_url') || 'https://delta.bz';

        function triggerDirectInstall() {
            window.location.href = "itms-services://?action=download-manifest&url=" + encodeURIComponent(storedPlistUrl);
        }

        function toggleAdmin() {
            const panel = document.getElementById('admin-panel');
            panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
            document.getElementById('plist-url').value = storedPlistUrl;
        }

        function savePlistUrl() {
            const url = document.getElementById('plist-url').value.trim();
            if(!url) return alert("https://betadrop.app/app/ytP4L3");
            localStorage.setItem('rtx_plist_url', url);
            storedPlistUrl = url;
            alert("تم تحديث كود التثبيت المباشر للزر بنجاح!");
            toggleAdmin();
        }
    </script>
</body>
</html>
